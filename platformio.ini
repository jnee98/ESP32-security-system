; ESP32 Home Security System
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor

[platformio]
default_envs = esp32c6-devkitc-1

[env:esp32c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; Arduino as ESP-IDF component
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ; 4x4 matrix keypad
    https://github.com/Chris--A/Keypad.git
    ; I2C LCD 16x2 (Frank de Brabander version)
    https://github.com/fdebrabander/Arduino-LiquidCrystal-I2C-library.git

; Use Arduino as ESP-IDF component
board_build.arduino = 1
board_build.arduino.usb_cdc_on_boot = 1
